<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AlphaSync</title>

<script src="https://s3.tradingview.com/tv.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="7629A9E9-076E-4EBF-A8FA-9A7727E79D59.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SignalForge">

<style>
/* --- BASE RESET & MOBILE FIXES --- */
body {margin: 0;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;background: #0f172a;color: white; overflow-x: hidden;touch-action: pan-y;}
header {padding: 20px;background: #111827;text-align: center;font-size: 22px;font-weight: bold;}

.mobile-nav {position: fixed;bottom: 0;left: 0;right: 0;display: flex;background: #111827;border-top: 1px solid #334155;z-index: 9999;padding-bottom: env(safe-area-inset-bottom);}
.mobile-nav button {flex: 1;padding: 15px;font-size: 24px;background: none;border: none;color: white;touch-action: manipulation;}
.tab {display: none;padding: 15px;padding-bottom: 100px;}

.card {background: #1e293b;padding: 15px;border-radius: 12px;margin-bottom: 15px;width: 100%;box-sizing: border-box;}
input {padding: 12px;margin: 5px 0;border: none;border-radius: 6px;background: #334155;color: white;font-size: 16px; width: 100%;box-sizing: border-box;}
button {padding: 12px 16px;border: none;border-radius: 6px;cursor: pointer;background: #2563eb;color: white;font-weight: 600;touch-action: manipulation;}

table {width: 100%;border-collapse: collapse;display: block;overflow-x: auto; white-space: nowrap;-webkit-overflow-scrolling: touch;}
td, th {border: 1px solid #334155;padding: 10px;font-size: 14px;}

.stock-card {background: #1e293b;padding: 15px;border-radius: 12px;margin-bottom: 10px;width: 100%;box-sizing: border-box;}
.stock-card.active {border: 2px solid #3b82f6;background: #111827;transition: 0.2s;}

.green { color: #10b981; }
.red { color: #ef4444; }
</style>
</head>

<body>

<header>📈 AlphaSync</header>

<div id="user-status" style="background: #1e293b; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;">
    <div style="display: flex; align-items: center; gap: 10px;">
        <span style="color: #94a3b8; font-size: 0.9em;">Trader:</span>
        <strong id="user-display-name" style="color: #60a5fa;">Guest User</strong>
    </div>
    <button id="authButton" style="background:#4285F4;">🔐 Login with Google</button>
</div>

<div class="mobile-nav">
    <button onclick="showTab('dashboard')">📊</button>
    <button onclick="showTab('portfolio')">💼</button>
    <button onclick="showTab('analyzer')">🧠</button>
</div>

<div id="dashboard" class="tab">
    <div class="card">
        <h3>🚨 Alerts</h3>
        <div id="alerts"></div>
    </div>
    <div class="card">
        <h3>🏆 Top Opportunities</h3>
        <div id="topStocks"></div>
    </div>
    <div class="card">
        <h3>👀 Watchlist</h3>
        <div style="display:flex; gap:10px;">
            <input id="watchInput" placeholder="AAPL">
            <button onclick="addToWatchlistFromInput()">Add</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Symbol</th><th>Price</th><th>Change</th><th>Signal</th><th>Trend</th><th>Vol</th><th>Strength</th><th>Action</th>
                </tr>
            </thead>
            <tbody id="watchlist"></tbody>
        </table>
    </div>
</div>

<div id="portfolio" class="tab">
    <header style="margin-bottom: 10px;">
        <h2 style="margin: 0;">💼 My Portfolio</h2>
        <div class="card" style="display: flex; gap: 20px; margin-top: 10px; padding: 15px; flex-wrap: wrap; justify-content: space-around;">
            <span>💰 Invested: <strong id="totalInvested">0</strong></span>
            <span>📊 Value: <strong id="totalValue">0</strong></span>
            <span class="green">📈 P/L: <strong id="totalPL">0</strong></span>
            <span class="green">📈 Return: <strong id="totalReturn">0</strong>%</span>
        </div>
    </header>

    <div class="card" style="height: 25vh; min-height: 200px; padding: 5px; margin-bottom: 15px;">
        <div id="portfolioInlineChart" style="height: 100%; width: 100%;"></div>
    </div>

    <div class="card" style="display: flex; align-items: center; gap: 10px; padding: 12px; margin-bottom: 15px;">
        <h4 style="margin: 0;">➕ Add:</h4>
        <input id="pSymbol" placeholder="AAPL" style="flex:1;">
        <input id="pShares" type="number" placeholder="Shares" style="flex:1;">
        <input id="pPrice" type="number" placeholder="Price" style="flex:1;">
        <button onclick="addPortfolioStock()">Add Position</button>
    </div>

    <div id="portfolioCards" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;"></div>
</div>

<div id="analyzer" class="tab">
    <div class="card">
        <h3>Stock Analyzer</h3>
        <input id="aSymbol" placeholder="TSLA">
        <button onclick="analyzeStock()">Analyze</button>
        <div id="analysis"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDWY98CaQD6pdt_KQHRnHHSzhjItFNutBk",
        authDomain: "trading-app-847e3.firebaseapp.com",
        projectId: "trading-app-847e3",
        storageBucket: "trading-app-847e3.firebasestorage.app",
        messagingSenderId: "369458346233",
        appId: "1:369458346233:web:1cf817dcb8005d013e0a28"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.auth = auth;
    window.db = db;
    window.setDoc = setDoc;
    window.doc = doc;

    onAuthStateChanged(auth, async (user) => {
        const nameEl = document.getElementById("user-display-name");
        const authBtn = document.getElementById("authButton");

        if (user) {
            nameEl.innerText = user.displayName || user.email;
            authBtn.innerText = "🚪 Logout";
            authBtn.style.background = "#334155";
            authBtn.onclick = () => auth.signOut().then(() => location.reload());
            
            // Fetch saved data
            const ref = doc(db, "users", user.uid);
            const snap = await getDoc(ref);
            if (snap.exists()) {
                window.portfolio = snap.data().portfolio || [];
                window.watchlist = snap.data().watchlist || [];
                masterUpdate();
            }
        } else {
            nameEl.innerText = "Guest User";
            authBtn.innerText = "🔐 Login with Google";
            authBtn.style.background = "#4285F4";
            authBtn.onclick = () => signInWithPopup(auth, provider);
        }
    });
</script>

<script>
const API_KEY = "d7ul6g9r01qnv95o1750d7ul6g9r01qnv95o175g";
window.watchlist = [];
window.portfolio = [];
let selectedStock = "";

function showTab(tab){
    document.querySelectorAll(".tab").forEach(t=>t.style.display="none");
    document.getElementById(tab).style.display="block";
}

async function getStock(symbol){
    try{
        const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${API_KEY}`);
        return await res.json();
    }catch(e){ return {c:0,dp:0}; }
}

async function saveUserData() {
    const user = window.auth.currentUser;
    if (!user) return;
    try {
        await window.setDoc(window.doc(window.db, "users", user.uid), {
            portfolio: window.portfolio,
            watchlist: window.watchlist
        }, { merge: true });
    } catch (e) { console.error("Save error", e); }
}

async function addPortfolioStock() {
    const symbol = document.getElementById("pSymbol").value.toUpperCase();
    const shares = parseFloat(document.getElementById("pShares").value);
    const price = parseFloat(document.getElementById("pPrice").value);
    if (!symbol || isNaN(shares)) return;

    const data = await getStock(symbol);
    const existing = window.portfolio.find(p => p.symbol === symbol);

    if (existing) {
        const total = existing.shares + shares;
        existing.buyPrice = ((existing.shares * existing.buyPrice) + (shares * price)) / total;
        existing.shares = total;
    } else {
        window.portfolio.push({ symbol, shares, buyPrice: price, current: data.c, pl: 0 });
    }
    masterUpdate();
    saveUserData();
}

function removePortfolio(symbol){ 
    window.portfolio = window.portfolio.filter(p => p.symbol !== symbol);
    masterUpdate();
    saveUserData();
}

function selectStock(symbol) {
    selectedStock = symbol;
    const container = document.getElementById("portfolioInlineChart");
    container.innerHTML = "";
    new TradingView.widget({
        "container_id": "portfolioInlineChart",
        "symbol": `NASDAQ:${symbol}`,
        "interval": "D",
        "theme": "dark",
        "style": "2",
        "autosize": true,
        "hide_top_toolbar": true,
        "hide_legend": true,
        "backgroundColor": "#1e293b"
    });
    renderPortfolio();
}

function renderPortfolio() {
    const container = document.getElementById("portfolioCards");
    if (window.portfolio.length === 0) {
        container.innerHTML = "<p>No positions yet.</p>";
        return;
    }
    container.innerHTML = window.portfolio.map(p => `
        <div class="stock-card ${p.symbol === selectedStock ? 'active' : ''}" onclick="selectStock('${p.symbol}')">
            <div style="display:flex; justify-content:space-between;">
                <strong>${p.symbol}</strong>
                <span class="${p.pl >= 0 ? 'green' : 'red'}">$${p.pl.toFixed(2)}</span>
            </div>
            <div style="font-size:12px; color:#94a3b8; margin:5px 0;">${p.shares} shares @ $${p.buyPrice.toFixed(2)}</div>
            <button onclick="event.stopPropagation(); removePortfolio('${p.symbol}')" style="background:none; color:#ef4444; padding:0; font-size:11px;">Remove</button>
        </div>
    `).join("");
}

async function updatePortfolio(){
    for(let p of window.portfolio){
        const d = await getStock(p.symbol);
        p.current = d.c;
        p.pl = (p.current - p.buyPrice) * p.shares;
    }
}

function updatePortfolioSummary(){
    let invested = 0, current = 0;
    window.portfolio.forEach(p => {
        invested += p.buyPrice * p.shares;
        current += p.current * p.shares;
    });
    const pl = current - invested;
    const pct = invested > 0 ? (pl / invested) * 100 : 0;
    document.getElementById("totalInvested").innerText = invested.toFixed(2);
    document.getElementById("totalValue").innerText = current.toFixed(2);
    document.getElementById("totalPL").innerText = pl.toFixed(2);
    document.getElementById("totalReturn").innerText = pct.toFixed(2);
}

async function masterUpdate(){
    await updatePortfolio();
    renderPortfolio();
    updatePortfolioSummary();
    // Watchlist logic would go here
}

showTab("dashboard");
</script>
</body>
</html>
