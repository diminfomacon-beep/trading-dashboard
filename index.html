<!DOCTYPE html>
<html>
<head>
  <title>Trading Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>📈 My Trading App</h1>

  <!-- SINGLE STOCK VIEW -->
  <div>
    <input id="symbol" placeholder="Enter stock (AAPL)">
    <button onclick="getPrice()">Get Price</button>
    <h2 id="price">--</h2>
  </div>

  <hr>

  <!-- WATCHLIST -->
  <h1>📊 Live Watchlist</h1>

  <div>
    <input id="symbolInput" placeholder="Add stock (AAPL)">
    <button onclick="addSymbol()">Add</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Price</th>
        <th>Change</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="watchlist"></tbody>
  </table>
  
  <h2>📈 Live Chart</h2>

<div class="tradingview-widget-container">
  <div id="tradingview_chart"></div>
</div>

  <script src="app.js"></script>
<script type="text/javascript"
src="https://s3.tradingview.com/tv.js">
</script>

<script type="text/javascript">
new TradingView.widget({
  "width": "100%",
  "height": 500,
  "symbol": "NASDAQ:AAPL",
  "interval": "5",
  "timezone": "America/New_York",
  "theme": "dark",
  "style": "1",
  "locale": "en",
  "toolbar_bg": "#0f172a",
  "enable_publishing": false,
  "hide_top_toolbar": false,
  "save_image": false,
  "container_id": "tradingview_chart"
});
</script>
</body>
</html>
